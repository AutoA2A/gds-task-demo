<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的任务 · GDS 任务管理</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/shell.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .mt-cols { display: grid; grid-template-columns: 320px 1fr; gap: 12px; align-items: start; }
    .mt-list { display: flex; flex-direction: column; gap: 10px; padding: 12px; max-height: calc(100vh - 220px); overflow: auto; }
    .mt-card { border: 1px solid var(--g-border); border-radius: var(--g-radius-6); background: var(--g-surface); padding: 12px; cursor: pointer; position: relative; }
    .mt-card:hover { border-color: var(--g-brand); }
    .mt-card.active { border-color: var(--g-brand-dark); background: var(--g-brand-pale); }
    .mt-card.active::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--g-brand-dark); }
    .mt-card .c-name { font-size: 13px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .mt-card .c-sub { font-size: 11px; color: var(--g-text-weak); margin-top: 4px; }
    .mt-card .c-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--g-border-soft); }
    .mt-card .c-reward { color: var(--g-warning); font-weight: 600; font-size: 13px; }
    .mt-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 14px 16px; }
    .mt-stat { display: flex; flex-direction: column; gap: 3px; }
    .mt-stat .k { font-size: 11px; color: var(--g-text-weak); }
    .mt-stat .v { font-size: 15px; font-weight: 600; }
    .file-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--g-border-soft); font-size: 12px; }
    .file-row:last-child { border-bottom: 0; }
    .file-row .f-ic { width: 24px; height: 24px; border-radius: 4px; background: var(--g-brand-pale); color: var(--g-brand-dark); display: flex; align-items: center; justify-content: center; flex: none; font-size: 11px; }
    .quote-note { border-left: 3px solid var(--g-brand); background: var(--g-bg-soft); padding: 8px 12px; font-size: 12px; color: var(--g-text-sub); border-radius: 0 4px 4px 0; }
  </style>
</head>
<body data-page="my-tasks">
  <template id="page-content">
    <div class="mt-cols" id="mt-cols">
      <!-- 左:任务卡片列表 -->
      <div class="panel"><div class="mt-list" id="cards"></div></div>
      <!-- 右:任务详情 -->
      <div class="panel" id="detail"><div class="g-empty">请选择左侧任务查看详情</div></div>
    </div>
  </template>

  <script src="../js/nav-config.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/gds-ui.js"></script>
  <script src="../js/shell.js"></script>
  <script>
  window.onShellReady = function (Shell) {
    var D = window.DEMO_DATA, U = window.GDS_UI;
    var sel = null;

    function mine() {
      var me = Shell.currentIdentity();
      return window.GDS.load().filter(function (t) { return t.assignee_id === me.id; })
        .sort(function (a, b) {
          var r = D.urgencyRank[a.urgency] - D.urgencyRank[b.urgency];
          return r !== 0 ? r : a.task_id.localeCompare(b.task_id);
        });
    }

    function renderCards() {
      var list = mine();
      var box = document.getElementById('cards'); box.innerHTML = '';
      if (!list.length) {
        document.getElementById('mt-cols').style.gridTemplateColumns = '1fr';
        box.closest('.panel').innerHTML =
          '<div class="g-empty">当前身份(' + Shell.currentIdentity().name + ')没有分配给自己的任务。<br><br>' +
          '<button class="btn primary" id="switch-tom">切换为 Tom Chen 查看示例</button></div>';
        document.getElementById('detail').style.display = 'none';
        var sw = document.getElementById('switch-tom');
        if (sw) sw.onclick = function () { try { localStorage.setItem('gui-identity', 'tom'); } catch (e) {} location.reload(); };
        return;
      }
      if (!sel || !list.filter(function (t) { return t.task_id === sel; })[0]) sel = list[0].task_id;
      list.forEach(function (t) {
        var c = document.createElement('div');
        c.className = 'mt-card' + (t.task_id === sel ? ' active' : '');
        c.innerHTML =
          '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">' +
            '<div class="c-name">' + U.esc(t.project_name) + '</div>' +
            '<span class="tag ' + (D.statusTag[t.status] || 'neutral') + '" style="flex:none">' + t.status + '</span></div>' +
          '<div class="c-sub">' + U.esc(t.customer_name || '-') + ' · ' + t.region + ' · ' + t.design_no + '</div>' +
          '<div class="c-foot"><span class="c-reward">' + t.reward.toFixed(1) + ' WF</span>' +
            '<span class="tag dot ' + (D.urgencyTag[t.urgency] || 'neutral') + '">' + t.urgency + '</span></div>';
        c.onclick = function () { sel = t.task_id; renderCards(); renderDetail(); };
        box.appendChild(c);
      });
    }

    function stepFlow(t) {
      var reviewOn = window.GDS.reviewOn();
      var steps = [
        { label: 'CRM 派单', done: !!t.created_at },
        { label: '已分单', done: !!t.assign_time },
        { label: '上传结果', done: !!t.uploaded_at }
      ];
      if (reviewOn) steps.push({ label: '审核通过', done: !!t.reviewed_at });
      steps.push({ label: '推送 CRM', done: !!t.pushed_at });
      // 当前步 = 第一个未完成
      var curIdx = steps.findIndex(function (s) { return !s.done; });
      return steps.map(function (s, i) {
        var cls = s.done ? 'done' : (i === curIdx ? 'current' : '');
        return '<div class="detail-step ' + cls + '"><span class="s-dot">' + (s.done ? '✓' : (i + 1)) + '</span><span class="s-label">' + s.label + '</span></div>';
      }).join('');
    }

    function renderDetail() {
      var t = window.GDS.get(sel); if (!t) return;
      var box = document.getElementById('detail');
      var filesHtml = (t.uploaded_files && t.uploaded_files.length)
        ? t.uploaded_files.map(function (f) { return '<div class="file-row"><span class="f-ic">⬢</span><div style="flex:1;min-width:0"><div style="font-weight:600">' + U.esc(f.name) + '</div><div style="color:var(--g-text-weak);font-size:11px">' + f.size + ' · ' + f.time + '</div></div></div>'; }).join('')
        : '<div class="g-empty" style="padding:16px 0">暂无上传文件</div>';
      box.innerHTML =
        '<div class="section-head"><h3>' + U.esc(t.project_name) + '</h3>' +
          '<div style="display:flex;gap:6px"><span class="tag ' + (D.statusTag[t.status] || 'neutral') + '">' + t.status + '</span>' +
          '<span class="tag dot ' + (D.urgencyTag[t.urgency] || 'neutral') + '">' + t.urgency + '</span></div></div>' +
        '<div style="padding:8px 16px 0;color:var(--g-text-weak);font-size:12px">' + t.design_no + ' · 客户 ' + U.esc(t.customer_name || '-') + '</div>' +
        '<div class="mt-stats">' +
          '<div class="mt-stat"><span class="k">赏金</span><span class="v" style="color:var(--g-warning)">' + t.reward.toFixed(1) + ' WF</span></div>' +
          '<div class="mt-stat"><span class="k">任务类型·区域</span><span class="v" style="font-size:13px">' + t.task_type + ' · ' + t.region + '</span></div>' +
          '<div class="mt-stat"><span class="k">部门</span><span class="v" style="font-size:13px">' + t.department + '</span></div>' +
          '<div class="mt-stat"><span class="k">截止时间</span><span class="v" style="font-size:13px">' + (t.expected_complete_time || '-') + '</span></div>' +
        '</div>' +
        '<div class="detail-steps" style="border-top:1px solid var(--g-border-soft)">' + stepFlow(t) + '</div>' +
        '<div class="section-head"><h3>已上传文件</h3></div><div style="padding:4px 16px 12px">' + filesHtml + '</div>' +
        (t.note ? '<div style="padding:0 16px 14px"><div class="quote-note">' + U.esc(t.note) + '</div></div>' : '') +
        '<div class="drawer-foot" style="border-top:1px solid var(--g-border-soft)">' +
          '<button class="btn" id="d-full">查看任务全貌</button>' +
          (t.status === '已分派' && U.isAssignee(t) ? '<button class="btn primary" id="d-upload">上传处理结果</button>' : '') +
        '</div>';
      var full = document.getElementById('d-full');
      if (full) full.onclick = function () { location.href = 'review.html?id=' + t.task_id; };
      var up = document.getElementById('d-upload');
      if (up) up.onclick = function () { U.openUpload(Shell, t, function () { renderCards(); renderDetail(); }); };
    }

    renderCards();
    renderDetail();
  };
  </script>
</body>
</html>
